# GitHub's generated release notes, which release-draft.yml puts in every
# draft release: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# The release pull request itself is left out. release.yml opens it as
# github-actions[bot], and all it does is move the version the release is
# named for. Both spellings of the login are listed because the docs say
# only "user or bot login handles" without showing which form a bot takes.
changelog:
  exclude:
    authors:
      - github-actions
      - github-actions[bot]

# Publish — publishes every crate to crates.io when a GitHub release is
# published.
#
#   1. `cargo xtask verify-tag <tag>` refuses unless the workspace at the
#      tagged commit is at exactly the tag's version;
#   2. crates.io trusted publishing exchanges this job's GitHub OIDC token for
#      a crates.io token that lasts 30 minutes and is revoked when the job
#      ends: https://crates.io/docs/trusted-publishing
#   3. `cargo xtask publish <tag>` runs `cargo publish --workspace`, leaving
#      out every crate crates.io already has at this version, so a run that
#      failed partway can be run again.
#
# The job runs in the `crates-io` environment, and each crate's trusted
# publisher on crates.io names this file and that environment, so a token is
# only ever issued to this job.

name: Publish

on:
  release:
    types: [published]

# Never two publishes at once; a second waits for the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read # check out the tagged commit
      id-token: write # the OIDC token trusted publishing exchanges for a crates.io token
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Check the tag matches the workspace version
        # Before any token exists, so a mismatched release never gets one.
        run: cargo xtask verify-tag "$TAG"

      - name: Get a crates.io token
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo xtask publish "$TAG"
